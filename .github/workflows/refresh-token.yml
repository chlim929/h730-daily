name: refresh-token

on:
  schedule:
    - cron: '0 0 * * 1'  # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh long-lived token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_PAT secret이 없어요"; exit 1; fi
          resp=$(curl -sS --get https://graph.instagram.com/refresh_access_token \
            --data-urlencode grant_type=ig_refresh_token \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          new=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$new" ]; then
            echo "::error::토큰 갱신 실패"
            echo "$resp" | jq 'del(.access_token)'
            exit 1
          fi
          echo "::add-mask::$new"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$new"
          echo "갱신 완료 — 유효기간 $(( $(echo "$resp" | jq '.expires_in') / 86400 ))일"
