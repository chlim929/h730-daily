name: prepare

on:
  schedule:
    - cron: '45 22 * * *'  # 매일 07:45 KST
  workflow_dispatch:
    inputs:
      date:
        description: '날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
      letter:
        description: '레터 URL을 직접 지정 (비우면 아카이브에서 찾기)'
        required: false
      force:
        description: '이미 만든 날짜도 다시 만들기'
        type: boolean
        default: false
      publish_after:
        description: '게시 시각 늦추기 (예: 17:00, 비우면 16:00)'
        required: false
      style:
        description: '스타일 (auto = 번갈아, box = 상자형, line = 물결밑줄형)'
        type: choice
        options: [auto, box, line]
        default: auto
      dry_run:
        description: '테스트: 커밋·Issue 없이 카드만 만들어 실행 결과(Artifacts)로 받기'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: posts
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      # 제작기의 PNG 저장은 시스템에 설치된 폰트로 그린다
      - name: Install card fonts
        run: |
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          cp fonts/*.ttf ~/.local/share/fonts/
          cp fonts/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f
          fc-list : family weight | grep -E 'Gowun Dodum|Abril Fatface'
      - name: Make card
        working-directory: scripts
        run: python prepare.py ${{ inputs.dry_run && '--no-push' || '' }}
        env:
          DATE: ${{ inputs.date }}
          LETTER: ${{ inputs.letter }}
          FORCE: ${{ inputs.force }}
          PUBLISH_AFTER: ${{ inputs.publish_after }}
          STYLE: ${{ inputs.style }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          H730_ARCHIVE_URL: ${{ vars.H730_ARCHIVE_URL }}
          GH_TOKEN: ${{ github.token }}
      - name: Upload test card
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: card
          path: posts/*.*
          if-no-files-found: ignore
