<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Gowun Dodum 은 Regular 하나뿐인데 제작기는 '오늘의 문장'에 font-weight:600 을 쓴다.
    Windows 크롬은 이걸 가짜 볼드로 그리지만, 리눅스 크롬은 요청 굵기가 폰트보다 200 넘게
    클 때만 가짜 볼드를 쓴다. 폰트 굵기를 Light(300)로 등록해 600 이상에서 가짜 볼드가 걸리게 한다.
  -->
  <match target="scan">
    <test name="family"><string>Gowun Dodum</string></test>
    <edit name="weight" mode="assign"><const>light</const></edit>
  </match>
</fontconfig>
